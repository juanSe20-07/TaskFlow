<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskFlow</title>
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="app">
      <header class="panel-header">
        <h1 class="panel-titulo">TaskFlow</h1>
        <span class="panel-subtitulo">Gestión de tareas</span>
      </header>

      <!-- Formulario para crear nueva tarea -->
      <section class="panel-formulario" aria-label="Crear nueva tarea">
        <form id="form-nueva-tarea" class="form-nueva-tarea">
          <div class="form-grupo">
            <label for="input-titulo" class="form-label">Título de la tarea</label>
            <input
              type="text"
              id="input-titulo"
              class="form-input"
              placeholder="¿Qué necesitas hacer?"
              required
            />
          </div>
          <div class="form-grupo">
            <label for="select-prioridad" class="form-label">Prioridad</label>
            <select id="select-prioridad" class="form-select">
              <option value="alta">Alta</option>
              <option value="media" selected>Media</option>
              <option value="baja">Baja</option>
            </select>
          </div>
          <div class="form-grupo">
            <label for="select-etiqueta" class="form-label">Etiqueta</label>
            <select id="select-etiqueta" class="form-select">
              <option value="dev">Desarrollo</option>
              <option value="diseno">Diseño</option>
              <option value="docs">Documentación</option>
              <option value="analisis">Análisis</option>
              <option value="otro">Otro</option>
            </select>
          </div>
          <button type="submit" class="btn btn-primario">Crear tarea</button>
        </form>
      </section>

      <!-- Controles de filtro y orden -->
      <section class="panel-controles" aria-label="Filtros y ordenamiento">
        <div class="controles-grupo">
          <label for="filtro-estado" class="control-label">Filtrar por estado</label>
          <select id="filtro-estado" class="form-select">
            <option value="todas">Todas</option>
            <option value="hacer">Por hacer</option>
            <option value="progreso">En progreso</option>
            <option value="hecho">Hecho</option>
          </select>
        </div>
        <div class="controles-grupo">
          <label for="orden-tareas" class="control-label">Ordenar por</label>
          <select id="orden-tareas" class="form-select">
            <option value="prioridad">Prioridad</option>
            <option value="titulo">Título (A-Z)</option>
          </select>
        </div>
      </section>

      <main class="panel-tablero">
        <div class="tareas-contenedor">
          <div class="panel-columnas">
            <div class="columna" id="col-hacer">
              <div class="columna-header">
                <h2 class="columna-titulo">Por hacer</h2>
                <span class="columna-contador" id="contador-hacer">0</span>
              </div>
              <div class="columna-lista" id="lista-hacer"></div>
            </div>

            <div class="columna" id="col-progreso">
              <div class="columna-header">
                <h2 class="columna-titulo">En progreso</h2>
                <span class="columna-contador" id="contador-progreso">0</span>
              </div>
              <div class="columna-lista" id="lista-progreso"></div>
            </div>

            <div class="columna" id="col-hecho">
              <div class="columna-header">
                <h2 class="columna-titulo">Hecho</h2>
                <span class="columna-contador" id="contador-hecho">0</span>
              </div>
              <div class="columna-lista" id="lista-hecho"></div>
            </div>
          </div>
        </div>
      </main>
    </div>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
